// Generates the app's Baseline Profile: the code a user runs first (opening screens, switching tabs,
// going back) is compiled ahead of time on install, so the first open of a screen doesn't stall
// while that code is still being interpreted. Run on a connected emulator/device (API 33+):
//   ./gradlew :app:generateReleaseBaselineProfile
plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.baselineprofile'
}

android {
    namespace 'com.shamela.baselineprofile'
    compileSdk versions.androidCompileSdk

    defaultConfig {
        minSdk 28
        targetSdk versions.androidTargetSdk
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    targetProjectPath = ":app"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

baselineProfile {
    useConnectedDevices = true
}

dependencies {
    implementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.4.1'
}
