plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// Release signing — credentials live in a gitignored keystore.properties (base64 to
// preserve the exact password bytes, including a trailing space). Absent on fresh
// clones / CI without secrets, in which case release stays unsigned (as before).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.shamela.library'
    compileSdk versions.androidCompileSdk

    defaultConfig {
        applicationId "com.meminglr.shamela"
        minSdk versions.androidMinSdk
        targetSdk versions.androidTargetSdk
        versionCode 12
        versionName "1.11"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField(
                "String",
                "BASE_URL",
                "\"${localProperties['BASE_URL']}\""
        )

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    lint {
        // Lint runs on release builds again; existing warnings don't block, new errors are visible.
        checkReleaseBuilds true
        abortOnError false
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                keyAlias keystoreProperties['keyAlias']
                storePassword new String(keystoreProperties['storePasswordB64'].decodeBase64())
                keyPassword new String(keystoreProperties['keyPasswordB64'].decodeBase64())
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            android.applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "Shamela-Library-${variant.versionName}.apk"
                }
            }
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".dev"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            // Jar metadata of BouncyCastle (and others) that clashes and isn't needed at runtime.
            excludes += '/META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}
dependencies {
    // TLS with a Java-stream socket ("engine" mode), so the book server's handshake can be split
    // on networks that reset it (see BookServerConnection).
    implementation "org.conscrypt:conscrypt-android:2.5.3"
    // TLS whose server name can end in a dot ("host."): the same host for the book server, but not
    // for SNI filters that block "r2.dev" (see DottedSniConnection). Conscrypt refuses such names.
    implementation "org.bouncycastle:bctls-jdk18on:1.78.1"


    implementation "androidx.core:core-ktx:$versions.core_ktx"
    implementation platform("org.jetbrains.kotlin:kotlin-bom:$versions.kotlin_bom")
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$versions.lifecycle_runtime_ktx"
    implementation "androidx.activity:activity-compose:$versions.compose_activity"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$versions.lifecycle_runtime_ktx"

    //-> Gson library
    implementation "com.google.code.gson:gson:$versions.gson"
    //-> Jsoup: parses shamela.ws pages (catalog and book pages for the Şamile source)
    implementation 'org.jsoup:jsoup:1.18.3'
    //-> Joda-time: not used by the app itself, but Readium (r2-shared/r2-streamer, the reader's EPUB
    //   engine) depends on it; this raises its old 2.9.9 to a current release.
    implementation 'joda-time:joda-time:2.12.1'

    //-> Compose dependencies
    implementation platform("androidx.compose:compose-bom:$versions.compose_bom")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.material3:material3:$versions.material3"


    //-> Compose Navigation
    implementation "androidx.navigation:navigation-compose:$versions.navigation_compose"

    //-> WorkManager
    implementation "androidx.work:work-runtime-ktx:$versions.workmanager"

    //-> FolioReader
    implementation project(':folioreader')
    //-> AppTheme
    implementation project(':apptheme')


    //-> RoomDB
    implementation "androidx.room:room-runtime:$versions.room_version"
    ksp "androidx.room:room-compiler:$versions.room_version"
    implementation "androidx.room:room-ktx:$versions.room_version"


    //-> Hilt DI
    implementation "com.google.dagger:hilt-android:$versions.hilt_version"
    ksp "com.google.dagger:hilt-compiler:$versions.hilt_version"
    ksp "androidx.hilt:hilt-compiler:1.2.0"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    //-> Firebase
    implementation platform("com.google.firebase:firebase-bom:$firebase_bom")
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'

    //-> Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1"
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //-> Compose Testing
    androidTestImplementation platform("androidx.compose:compose-bom:$versions.compose_bom")
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}